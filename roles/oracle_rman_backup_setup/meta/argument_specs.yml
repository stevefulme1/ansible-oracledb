---
argument_specs:
  main:
    short_description: "Configure RMAN backup policies and schedules"
    options:
      oracle_rman_backup_setup_host:
        description: Target host address
        type: str
        required: true
      oracle_rman_backup_setup_username:
        description: Authentication username
        type: str
      oracle_rman_backup_setup_password:
        description: Authentication password
        type: str
        no_log: true
      oracle_rman_backup_setup_api_key:
        description: API key for authentication
        type: str
        no_log: true
      oracle_rman_backup_setup_validate_certs:
        description: Validate SSL certificates
        type: bool
        default: true
      oracle_rman_backup_setup_state:
        description: Desired state
        type: str
        default: present
        choices: [present, absent]
