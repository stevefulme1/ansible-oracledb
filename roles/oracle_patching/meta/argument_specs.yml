---
argument_specs:
  main:
    short_description: "Rolling patch application for RAC and single instance"
    options:
      oracle_patching_host:
        description: Target host address
        type: str
        required: true
      oracle_patching_username:
        description: Authentication username
        type: str
      oracle_patching_password:
        description: Authentication password
        type: str
        no_log: true
      oracle_patching_api_key:
        description: API key for authentication
        type: str
        no_log: true
      oracle_patching_validate_certs:
        description: Validate SSL certificates
        type: bool
        default: true
      oracle_patching_state:
        description: Desired state
        type: str
        default: present
        choices: [present, absent]
