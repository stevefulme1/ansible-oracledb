---
argument_specs:
  main:
    short_description: "Deploy Oracle Data Guard standby from scratch"
    options:
      oracle_dataguard_setup_host:
        description: Target host address
        type: str
        required: true
      oracle_dataguard_setup_username:
        description: Authentication username
        type: str
      oracle_dataguard_setup_password:
        description: Authentication password
        type: str
      oracle_dataguard_setup_api_key:
        description: API key for authentication
        type: str
      oracle_dataguard_setup_validate_certs:
        description: Validate SSL certificates
        type: bool
        default: true
      oracle_dataguard_setup_state:
        description: Desired state
        type: str
        default: present
        choices: [present, absent]
