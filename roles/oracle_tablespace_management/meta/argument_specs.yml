---
argument_specs:
  main:
    short_description: "Auto-extend, resize, and manage tablespaces"
    options:
      oracle_tablespace_management_host:
        description: Target host address
        type: str
        required: true
      oracle_tablespace_management_username:
        description: Authentication username
        type: str
      oracle_tablespace_management_password:
        description: Authentication password
        type: str
      oracle_tablespace_management_api_key:
        description: API key for authentication
        type: str
      oracle_tablespace_management_validate_certs:
        description: Validate SSL certificates
        type: bool
        default: true
      oracle_tablespace_management_state:
        description: Desired state
        type: str
        default: present
        choices: [present, absent]
