---
- name: "Oracledb Alert Remediation"
  hosts: all
  sources:
    - stevefulme1.oracledb.oem_webhook:
        host: 127.0.0.1
        port: 5000
  rules:
    - name: Critical alert
      condition: >-
        event.oracledb.severity is defined and
        event.oracledb.severity == "critical"
      action:
        run_playbook:
          name: remediate.yml
          extra_vars:
            alert_host: "{{ event.oracledb.host | default('') }}"
            alert_id: "{{ event.oracledb.id | default('') }}"
    - name: Warning alert
      condition: >-
        event.oracledb.severity is defined and
        event.oracledb.severity == "warning"
      action:
        print_event:
          pretty: true
