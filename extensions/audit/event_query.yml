---
# extensions/audit/event_query.yml
# Maps module return values to the AAP Normalized Resource Taxonomy
# for indirect node counting.
#
# Oracle DB modules return API response dicts.  PDBs, tablespaces,
# listeners, RAC nodes, services, and users are all tracked as
# database_relational resources.

stevefulme1.oracledb.oracle_pdb:
  query: >-
    {
      name: .pdb.name,
      canonical_facts: {
        uuid: .pdb.id
      },
      facts: {
        device_type: "database_relational"
      }
    }

stevefulme1.oracledb.oracle_tablespace:
  query: >-
