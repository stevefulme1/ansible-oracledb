---
- name: Test oracle_awr_snapshot module
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create awr_snapshot (check mode)
      stevefulme1.oracledb.oracle_awr_snapshot:
        host: "{{ test_host }}"
        name: "test-awr-snapshot"
        state: present
      check_mode: true
      register: check_result
      ignore_errors: true

    - name: Verify check mode reports changed
      ansible.builtin.assert:
        that:
          - check_result is changed or check_result is failed
        fail_msg: "Check mode did not report changed"

    - name: List awr_snapshots
      stevefulme1.oracledb.oracle_awr_snapshot_info:
        host: "{{ test_host }}"
      register: list_result
      ignore_errors: true

    - name: Verify list returns a list
      ansible.builtin.assert:
        that:
          - list_result.awr_snapshots is defined or list_result is failed
        fail_msg: "List did not return expected structure"
