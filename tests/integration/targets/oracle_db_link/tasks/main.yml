---
- name: Test oracle_db_link module
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create db_link (check mode)
      stevefulme1.oracledb.oracle_db_link:
        host: "{{ test_host }}"
        name: "test-db-link"
        state: present
      check_mode: true
      register: check_result
      ignore_errors: true

    - name: Verify check mode reports changed
      ansible.builtin.assert:
        that:
          - check_result is changed or check_result is failed
        fail_msg: "Check mode did not report changed"

    - name: List db_links
      stevefulme1.oracledb.oracle_db_link_info:
        host: "{{ test_host }}"
      register: list_result
      ignore_errors: true

    - name: Verify list returns a list
      ansible.builtin.assert:
        that:
          - list_result.db_links is defined or list_result is failed
        fail_msg: "List did not return expected structure"
