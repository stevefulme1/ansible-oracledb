---
- name: Test oracle_dataguard_config module
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create dg_config (check mode)
      stevefulme1.oracledb.oracle_dataguard_config:
        host: "{{ test_host }}"
        name: "test-dg-config"
        state: present
      check_mode: true
      register: check_result
      ignore_errors: true

    - name: Verify check mode reports changed
      ansible.builtin.assert:
        that:
          - check_result is changed or check_result is failed
        fail_msg: "Check mode did not report changed"

    - name: List dg_configs
      stevefulme1.oracledb.oracle_dataguard_config_info:
        host: "{{ test_host }}"
      register: list_result
      ignore_errors: true

    - name: Verify list returns a list
      ansible.builtin.assert:
        that:
          - list_result.dg_configs is defined or list_result is failed
        fail_msg: "List did not return expected structure"
